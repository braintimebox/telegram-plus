name: Build Telegram Plus

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Regenerate provisioning profiles for custom bundle
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/RegenerateProfilesForBundle.py \
            --profiles build-system/fake-codesigning/profiles \
            --certs-path build-system/fake-codesigning/certs \
            --old-bundle ph.telegra.Telegraph \
            --new-bundle ph.telegra.TelegramPlus

      - name: Cache Bazel disk cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          # Telegram Plus: the previous cache was keyed on a hash of every BUILD
          # file, so any edit to any BUILD invalidated it, and it cached the Bazel
          # user root, which is far larger than GitHub's 10 GB budget. Bazel's own
          # content-addressed disk cache is the right thing to persist: it survives
          # BUILD edits, is validated by action digest, and reuses compiled objects.
          path: /Users/Shared/bazel_disk_cache
          key: ${{ runner.os }}-bazel-disk-v1
          restore-keys: |
            ${{ runner.os }}-bazel-disk-

      - name: Build the App
        run: |
          set -x
          set -o pipefail
          mkdir -p /tmp/tgp-logs
          exec > >(tee -a /tmp/tgp-logs/build.log) 2>&1

          SOURCE_DIR=/Users/Shared/telegram-ios
          mkdir -p /Users/Shared/bazel_cache
          mkdir -p /Users/Shared/bazel_disk_cache
          BAZEL_USER_ROOT="/Users/Shared/bazel_cache"
          BAZEL_DISK_CACHE="/Users/Shared/bazel_disk_cache"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_DISK_CACHE" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/telegram-plus-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          # Make.py copies the built .ipa + DSYMs into build/artifacts using
          # the fork's own name — discover it, don't hardcode (Swiftgram.ipa vs
          # Telegram.ipa differ by upstream). Then normalise to TelegramPlus.ipa.
          cd $SOURCE_DIR
          OUTPUT_PATH="build/artifacts"
          ls -la "$OUTPUT_PATH"
          SRC_IPA=$(find "$OUTPUT_PATH" -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$SRC_IPA" ]; then
            echo "ERROR: no .ipa found in $OUTPUT_PATH"
            ls -la "$OUTPUT_PATH" || true
            exit 1
          fi
          echo "Collected $SRC_IPA -> TelegramPlus.ipa"
          cp "$SRC_IPA" "$OUTPUT_PATH/TelegramPlus.ipa"

      - name: Inspect entitlements of built IPA
        run: |
          set -x
          cd /Users/Shared/telegram-ios/build/artifacts
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa
          unzip -q TelegramPlus.ipa -d /tmp/ipa
          APP=$(ls -d /tmp/ipa/Payload/*.app | head -1)
          echo "=== bundle id ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "=== app entitlements (codesign) ==="
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo "=== embedded profile: main app ==="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | plutil -p - \
            | grep -E "application-groups|application-identifier|aps-environment" -A2 || true
          echo "=== embedded profile: extensions ==="
          for e in "$APP"/PlugIns/*.appex; do
            echo "--- $(basename "$e") ---"
            security cms -D -i "$e/embedded.mobileprovision" 2>/dev/null | plutil -p - \
              | grep -E "application-groups|application-identifier" -A2 || true
          done

      - name: Build diagnostics on failure
        if: failure()
        run: |
          echo "=== последние 250 строк лога сборки ==="
          tail -250 /tmp/tgp-logs/build.log 2>/dev/null || echo "(лог сборки недоступен)"
          echo "=== диск и кэш Bazel ==="
          df -h /Users/Shared | tail -1
          du -sh /Users/Shared/bazel_cache 2>/dev/null || echo "(кэш Bazel отсутствует)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPlus-build-log-failed
          path: /tmp/tgp-logs/build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPlus-${{ env.APP_VERSION }}-unsigned
          path: /Users/Shared/telegram-ios/build/artifacts/TelegramPlus.ipa
          retention-days: 30

      - name: Upload DSYMs
        run: |
          cd /Users/Shared/telegram-ios/build/artifacts
          if [ -d DSYMs ]; then
            zip -r TelegramPlus.DSYMs.zip DSYMs
          else
            echo "No DSYMs dir; skipping zip"
            mkdir -p DSYMs
            zip -r TelegramPlus.DSYMs.zip DSYMs
          fi
        shell: bash
      - name: Upload DSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPlus-${{ env.APP_VERSION }}-dsyms
          path: /Users/Shared/telegram-ios/build/artifacts/TelegramPlus.DSYMs.zip
          retention-days: 30

      # Artifacts need a signed-in browser session and expire after 30 days.
      # A release gives a permanent, direct download link for the same IPA.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd /Users/Shared/telegram-ios/build/artifacts

          TAG="build-${BUILD_NUMBER}"
          TITLE="Telegram Plus ${APP_VERSION} (build ${BUILD_NUMBER})"
          NOTES="Unsigned build from commit ${GITHUB_SHA}. Install it with a sideloading tool (Feather, SideStore, AltStore)."

          FILES=(TelegramPlus.ipa)
          if [ -f TelegramPlus.DSYMs.zip ]; then
            FILES+=(TelegramPlus.DSYMs.zip)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES"
          fi

          echo "=== release URL ==="
          gh release view "$TAG" --json url,assets -q '.url, (.assets[].name)'
